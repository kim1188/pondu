# 흐름 F 소유. `xcodegen generate`로 Pondu.xcodeproj를 만든다(생성물은 저장소에 올리지 않는다).
# 처음 여는 방법은 ios/README.md 참고.
name: Pondu
options:
  bundleIdPrefix: com.example      # 본인 소유 도메인으로 바꾼다(M0 명세 1절)
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko
  generateEmptyDirectories: false

# 프로젝트 주소와 공개용 키는 App/Config/Secrets.xcconfig(저장소에 올리지 않음)에서 들어온다.
configFiles:
  Debug: App/Config/Shared.xcconfig
  Release: App/Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

packages:
  PonduKit:
    path: PonduKit

targets:
  Pondu:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Config/**"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pondu
        PRODUCT_NAME: Pondu
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""        # 본인 팀 ID를 넣는다
    dependencies:
      - package: PonduKit
        product: PonduCore
      - package: PonduKit
        product: FeatureAuth
      - package: PonduKit
        product: FeatureSession
      - package: PonduKit
        product: FeatureRecord
      - package: PonduKit
        product: FeatureTogether
      - package: PonduKit
        product: FeatureToday
    scheme:
      testTargets: []
      gatherCoverageData: false
